name: Community actions (scan, repost, follow)
on:
  workflow_dispatch:
    inputs:
      action:
        description: "scan | repost | follow"
        required: true
      target:
        description: "repost: post ID. follow: username (no @). scan: leave blank"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests-oauthlib
      - name: Act
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import json, traceback
          try:
              exec(open("engage_impl.py").read())
          except Exception:
              json.dump({"status": 500, "error": traceback.format_exc()[-1500:]}, open("engage_result.json","w"), indent=1)
              print(traceback.format_exc())
          PY
      - name: Save
        run: |
          git config user.name x-autopost-bot
          git config user.email actions@users.noreply.github.com
          for f in engage_state.json engage_result.json watch.json engaged.jsonl; do [ -f "$f" ] && git add "$f"; done
          git commit -m "engage" && (git push || (git pull --rebase && git push)) || echo nothing
