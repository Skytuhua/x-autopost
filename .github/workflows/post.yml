name: Post to X
on:
  workflow_dispatch:
    inputs:
      text:
        description: Post text
        required: true
      visual_spec:
        description: "Story image brief JSON; see docs/IMAGES.md. Normal path for new story images."
        required: false
        default: ""
      media:
        description: "Legacy/manual images only. Up to 4 repo paths or HTTPS URLs; use visual_spec for story images."
        required: false
        default: ""
      reply_to:
        description: "Optional post ID for an allowed reply"
        required: false
        default: ""
      preview:
        description: "Render and validate only. No X uploads, posts or history changes."
        type: boolean
        required: false
        default: false
      dry_run:
        description: "Legacy upload-only test: uploads media to X without posting. Prefer preview."
        required: false
        default: "false"
permissions:
  contents: write
concurrency:
  group: ${{ inputs.preview && 'x-autopost-preview' || 'x-autopost-sender' }}
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Allow publishing only from main
        if: ${{ !inputs.preview && github.ref != 'refs/heads/main' }}
        run: exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install image renderer browser
        if: inputs.visual_spec != ''
        run: python -m playwright install --with-deps chromium
      - name: Prepare story image without X credentials
        env:
          VISUAL_SPEC: ${{ inputs.visual_spec }}
          POST_MEDIA: ${{ inputs.media }}
          VISUAL_PREVIEW: ${{ inputs.preview }}
        run: python -m visuals.prepare
      - name: Post or upload-only test
        if: ${{ !inputs.preview }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          POST_TEXT: ${{ inputs.text }}
          REPLY_TO: ${{ inputs.reply_to }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python posting.py
      - name: Save result and published image provenance
        if: ${{ !inputs.preview }}
        run: |
          python save_results.py
          git push || (git pull --rebase && git push)
      - name: Save image review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-image-${{ github.run_id }}
          path: output/review/
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail if sending failed
        if: ${{ !inputs.preview }}
        run: python -c "import json,sys; sys.exit(0 if json.load(open('last_result.json'))['status'] in (200,201) else 1)"
