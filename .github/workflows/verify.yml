name: Verify story images
on:
  pull_request:
  push:
    branches: [main]
    paths: ['visuals/**', 'tests/**', 'assets/fonts/**', 'posting.py', 'save_results.py', 'requirements.txt', '.github/workflows/verify.yml', '.github/workflows/post.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python -m visuals.smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-smoke
          path: output/smoke/
          retention-days: 14
